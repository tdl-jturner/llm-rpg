<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM RPG</title>
    <style>
      /* ── Color palette (swap palette here) ───────────────────────────── */

      :root {
        --color-player-input: #7ec8e3;
        --color-narrative:    #d4c5a9;
        --color-system-msg:   #888888;
        --color-damage:       #e35a5a;
        --color-hud:          #d4c5a9;
        --color-hud-bg:       #111111;
        --color-bg:           #1a1a1a;
        --color-border:       #333333;
        --color-input-area:   #111111;
        --color-accent:       #7ec8e3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--color-bg);
        color: var(--color-narrative);
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* ── World Picker ──────────────────────────────────────────────────── */

      #world-picker {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 24px 32px;
        overflow-y: auto;
      }

      #world-picker h1 {
        font-size: 18px;
        color: var(--color-accent);
        margin-bottom: 4px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      #world-picker p.subtitle {
        color: var(--color-system-msg);
        margin-bottom: 24px;
        font-size: 12px;
      }

      #world-picker .error-msg {
        color: var(--color-damage);
        margin-bottom: 12px;
        min-height: 1.2em;
        font-size: 12px;
      }

      #world-list {
        list-style: none;
        margin-bottom: 24px;
      }

      #world-list li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid #2a2a2a;
      }

      #world-list li span.world-title {
        flex: 1;
      }

      button {
        background: #2a2a2a;
        border: 1px solid #444;
        color: var(--color-narrative);
        font-family: inherit;
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
      }

      button:hover {
        background: #333;
        border-color: #666;
      }

      button.primary {
        background: #1a3a4a;
        border-color: var(--color-accent);
        color: var(--color-accent);
      }

      button.primary:hover {
        background: #1e4a5e;
      }

      button.danger {
        border-color: #6a2a2a;
        color: var(--color-damage);
      }

      button.danger:hover {
        background: #3a1a1a;
      }

      #no-worlds-msg {
        color: #666;
        font-size: 12px;
        margin-bottom: 12px;
      }

      /* ── Ollama Setup Screen ───────────────────────────────────────────── */

      #ollama-setup {
        flex: 1;
        display: none; /* shown by renderer when needed */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        gap: 16px;
      }

      #ollama-setup h2 {
        font-size: 16px;
        color: var(--color-accent);
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      #ollama-status-msg {
        color: var(--color-narrative);
        text-align: center;
        max-width: 480px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      #ollama-progress-msg {
        color: var(--color-system-msg);
        font-size: 11px;
        text-align: center;
        max-width: 480px;
        line-height: 1.5;
        min-height: 2em;
      }

      #ollama-setup-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      #model-config {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
        width: 100%;
        max-width: 480px;
      }

      #model-config details {
        border: 1px solid var(--color-border);
        padding: 10px 14px;
      }

      #model-config summary {
        cursor: pointer;
        color: var(--color-system-msg);
        font-size: 12px;
        letter-spacing: 1px;
        user-select: none;
      }

      #model-config summary:hover {
        color: var(--color-narrative);
      }

      .model-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 10px;
      }

      .model-field label {
        font-size: 11px;
        color: var(--color-system-msg);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .model-field input[type="text"] {
        background: #111;
        border: 1px solid #444;
        color: var(--color-narrative);
        font-family: inherit;
        font-size: 13px;
        padding: 4px 8px;
        width: 100%;
        outline: none;
      }

      .model-field input[type="text"]:focus {
        border-color: var(--color-accent);
      }

      #model-config-status {
        font-size: 11px;
        color: var(--color-system-msg);
        min-height: 1.2em;
        margin-top: 6px;
      }

      /* ── Game View ─────────────────────────────────────────────────────── */

      #game-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        display: none; /* hidden until a world is loaded */
      }

      #hud {
        background: var(--color-hud-bg);
        border-bottom: 1px solid var(--color-border);
        padding: 6px 16px;
        font-size: 12px;
        color: var(--color-system-msg);
        display: flex;
        gap: 4px;
        white-space: nowrap;
        overflow: hidden;
      }

      #hud span {
        color: var(--color-hud);
      }

      #scrollback {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        line-height: 1.6;
      }

      #scrollback p {
        margin-bottom: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #scrollback p.player-input {
        color: var(--color-player-input);
      }

      #scrollback p.narrative {
        color: var(--color-narrative);
      }

      #scrollback p.system-msg {
        color: var(--color-system-msg);
        font-style: italic;
      }

      #scrollback p.damage {
        color: var(--color-damage);
      }

      #input-area {
        display: flex;
        align-items: center;
        border-top: 1px solid var(--color-border);
        padding: 8px 16px;
        background: var(--color-input-area);
      }

      #input-area span {
        color: var(--color-player-input);
        margin-right: 8px;
        user-select: none;
      }

      #input-form {
        flex: 1;
        display: flex;
      }

      #input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--color-player-input);
        font-family: inherit;
        font-size: inherit;
        outline: none;
        caret-color: var(--color-player-input);
      }

      #input:disabled {
        opacity: 0.5;
      }

      #back-to-picker {
        background: none;
        border: none;
        color: #555;
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
        padding: 0;
        margin-right: 8px;
      }

      #back-to-picker:hover {
        color: var(--color-system-msg);
      }

      /* ── Generation spinner ────────────────────────────────────────────── */

      #spinner {
        display: none;
        color: var(--color-player-input);
        margin-left: 8px;
        font-size: 12px;
        animation: blink 0.8s step-start infinite;
        user-select: none;
      }

      #spinner.active {
        display: inline;
      }

      @keyframes blink {
        0%   { opacity: 1; }
        50%  { opacity: 0.2; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>

    <!-- World Picker Screen -->
    <div id="world-picker">
      <h1>LLM RPG</h1>
      <p class="subtitle">Infinite procedurally generated interactive fiction</p>

      <div class="error-msg" id="picker-error"></div>

      <p id="no-worlds-msg" style="display:none">No worlds yet. Create one to begin.</p>
      <ul id="world-list"></ul>

      <button class="primary" id="btn-create-world">+ Create New World (select WORLD.md)</button>
    </div>

    <!-- Ollama Setup Screen -->
    <div id="ollama-setup">
      <h2>Ollama Setup</h2>
      <p id="ollama-status-msg">Checking Ollama...</p>
      <p id="ollama-progress-msg"></p>
      <div id="ollama-setup-buttons"></div>

      <div id="model-config">
        <details>
          <summary>Model Configuration</summary>
          <div class="model-field">
            <label for="input-heavy-model">Heavy Model (generation)</label>
            <input type="text" id="input-heavy-model" autocomplete="off" spellcheck="false" />
          </div>
          <div class="model-field">
            <label for="input-light-model">Light Model (intent parsing)</label>
            <input type="text" id="input-light-model" autocomplete="off" spellcheck="false" />
          </div>
          <div id="model-config-status"></div>
        </details>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-view">
      <div id="hud">
        HP:&nbsp;<span id="hud-hp">—</span>&nbsp;&nbsp;·&nbsp;&nbsp;Wielding:&nbsp;<span id="hud-weapon">fists (1–2)</span>&nbsp;&nbsp;·&nbsp;&nbsp;<span id="hud-room">—</span>
      </div>
      <div id="scrollback"></div>
      <div id="input-area">
        <button id="back-to-picker" title="Back to world picker">[worlds]</button>
        <span>&gt;</span>
        <form id="input-form">
          <input id="input" type="text" autocomplete="off" spellcheck="false" />
        </form>
        <span id="spinner">generating...</span>
      </div>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
