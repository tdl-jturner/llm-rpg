<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM RPG</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>

    <!-- World Picker Screen -->
    <div id="world-picker">
      <div id="world-picker-header">
        <h1>LLM RPG</h1>
        <p class="subtitle">Infinite procedurally generated interactive fiction</p>
        <div class="error-msg" id="picker-error"></div>
      </div>

      <div id="world-picker-body">
        <p id="no-worlds-msg" style="display:none">No worlds yet. Create one to begin.</p>
        <ul id="world-list"></ul>

        <button class="primary" id="btn-create-world">+ Create New World (select WORLD.md)</button>
      </div>
    </div>

    <!-- Ollama Setup Screen -->
    <div id="ollama-setup">
      <h2>The Oracle Chamber</h2>
      <p id="ollama-setup-subtitle">preparing your AI companions</p>
      <p id="ollama-status-msg">Rousing the oracles...</p>
      <p id="ollama-progress-msg"></p>
      <p id="ollama-flavor-msg"></p>
      <div id="ollama-setup-buttons"></div>

      <div id="model-config">
        <details>
          <summary>Chosen Minds</summary>
          <div class="model-field">
            <label for="input-provider">Oracle Origin</label>
            <select id="input-provider">
              <option value="ollama">Ollama</option>
              <option value="google-ai-studio">Google AI Studio</option>
              <option value="openrouter">OpenRouter</option>
            </select>
          </div>
          <div class="model-field" id="api-key-field" style="display:none">
            <label for="input-api-key">Binding Seal (API Key)</label>
            <input type="password" id="input-api-key" autocomplete="off" spellcheck="false" placeholder="AIza..." />
          </div>
          <div class="model-field">
            <label for="input-heavy-model">Heavy Mind &mdash; the narrator</label>
            <select id="input-heavy-model"></select>
          </div>
          <div class="model-field">
            <label for="input-light-model">Light Mind &mdash; the interpreter</label>
            <select id="input-light-model"></select>
          </div>
          <div id="model-config-status"></div>
        </details>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-view">
      <div id="hud">
        HP:&nbsp;<span id="hud-hp">—</span>&nbsp;&nbsp;·&nbsp;&nbsp;Wielding:&nbsp;<span id="hud-weapon">fists (1–2)</span>&nbsp;&nbsp;·&nbsp;&nbsp;<span id="hud-room">—</span>
      </div>
      <div id="scrollback"></div>
      <div id="input-area">
        <button id="back-to-picker" title="Back to world picker">[worlds]</button>
        <button id="open-oracles" title="Configure oracles">[oracles]</button>
        <span>&gt;</span>
        <form id="input-form">
          <input id="input" type="text" autocomplete="off" spellcheck="false" />
        </form>
        <span id="spinner"></span>
      </div>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
