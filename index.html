<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM RPG</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #1a1a1a;
        color: #d4c5a9;
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      #scrollback {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        line-height: 1.6;
      }

      #scrollback p {
        margin-bottom: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #input-area {
        display: flex;
        align-items: center;
        border-top: 1px solid #333;
        padding: 8px 16px;
        background: #111;
      }

      #input-area span {
        color: #7ec8e3;
        margin-right: 8px;
        user-select: none;
      }

      #input-form {
        flex: 1;
        display: flex;
      }

      #input {
        flex: 1;
        background: transparent;
        border: none;
        color: #7ec8e3;
        font-family: inherit;
        font-size: inherit;
        outline: none;
        caret-color: #7ec8e3;
      }

      #input:disabled {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="scrollback"></div>
    <div id="input-area">
      <span>&gt;</span>
      <form id="input-form">
        <input id="input" type="text" autofocus autocomplete="off" spellcheck="false" />
      </form>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
