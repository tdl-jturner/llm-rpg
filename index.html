<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM RPG</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #1a1a1a;
        color: #d4c5a9;
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* ── World Picker ──────────────────────────────────────────────────── */

      #world-picker {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 24px 32px;
        overflow-y: auto;
      }

      #world-picker h1 {
        font-size: 18px;
        color: #7ec8e3;
        margin-bottom: 4px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      #world-picker p.subtitle {
        color: #888;
        margin-bottom: 24px;
        font-size: 12px;
      }

      #world-picker .error-msg {
        color: #e35a5a;
        margin-bottom: 12px;
        min-height: 1.2em;
        font-size: 12px;
      }

      #world-list {
        list-style: none;
        margin-bottom: 24px;
      }

      #world-list li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid #2a2a2a;
      }

      #world-list li span.world-title {
        flex: 1;
      }

      button {
        background: #2a2a2a;
        border: 1px solid #444;
        color: #d4c5a9;
        font-family: inherit;
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
      }

      button:hover {
        background: #333;
        border-color: #666;
      }

      button.primary {
        background: #1a3a4a;
        border-color: #7ec8e3;
        color: #7ec8e3;
      }

      button.primary:hover {
        background: #1e4a5e;
      }

      button.danger {
        border-color: #6a2a2a;
        color: #e35a5a;
      }

      button.danger:hover {
        background: #3a1a1a;
      }

      #no-worlds-msg {
        color: #666;
        font-size: 12px;
        margin-bottom: 12px;
      }

      /* ── Game View ─────────────────────────────────────────────────────── */

      #game-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        display: none; /* hidden until a world is loaded */
      }

      #hud {
        background: #111;
        border-bottom: 1px solid #333;
        padding: 6px 16px;
        font-size: 12px;
        color: #888;
        display: flex;
        gap: 24px;
      }

      #hud span {
        color: #d4c5a9;
      }

      #scrollback {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        line-height: 1.6;
      }

      #scrollback p {
        margin-bottom: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #scrollback p.player-input {
        color: #7ec8e3;
      }

      #scrollback p.system-msg {
        color: #888;
        font-style: italic;
      }

      #input-area {
        display: flex;
        align-items: center;
        border-top: 1px solid #333;
        padding: 8px 16px;
        background: #111;
      }

      #input-area span {
        color: #7ec8e3;
        margin-right: 8px;
        user-select: none;
      }

      #input-form {
        flex: 1;
        display: flex;
      }

      #input {
        flex: 1;
        background: transparent;
        border: none;
        color: #7ec8e3;
        font-family: inherit;
        font-size: inherit;
        outline: none;
        caret-color: #7ec8e3;
      }

      #input:disabled {
        opacity: 0.5;
      }

      #back-to-picker {
        background: none;
        border: none;
        color: #555;
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
        padding: 0;
        margin-right: 8px;
      }

      #back-to-picker:hover {
        color: #888;
      }

      /* ── Generation spinner ────────────────────────────────────────────── */

      #spinner {
        display: none;
        color: #7ec8e3;
        margin-left: 8px;
        font-size: 12px;
        animation: blink 0.8s step-start infinite;
        user-select: none;
      }

      #spinner.active {
        display: inline;
      }

      @keyframes blink {
        0%   { opacity: 1; }
        50%  { opacity: 0.2; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>

    <!-- World Picker Screen -->
    <div id="world-picker">
      <h1>LLM RPG</h1>
      <p class="subtitle">Infinite procedurally generated interactive fiction</p>

      <div class="error-msg" id="picker-error"></div>

      <p id="no-worlds-msg" style="display:none">No worlds yet. Create one to begin.</p>
      <ul id="world-list"></ul>

      <button class="primary" id="btn-create-world">+ Create New World (select WORLD.md)</button>
    </div>

    <!-- Game Screen -->
    <div id="game-view">
      <div id="hud">
        HP: <span id="hud-hp">—</span> &nbsp;|&nbsp;
        Room: <span id="hud-room">—</span>
      </div>
      <div id="scrollback"></div>
      <div id="input-area">
        <button id="back-to-picker" title="Back to world picker">[worlds]</button>
        <span>&gt;</span>
        <form id="input-form">
          <input id="input" type="text" autocomplete="off" spellcheck="false" />
        </form>
        <span id="spinner">generating...</span>
      </div>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
